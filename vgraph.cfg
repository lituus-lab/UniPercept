# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (hashes -> hashes.nim) or
# a directory. Modules under no listed layer are unconstrained: the umbrella
# module re-exports everything.
# gray < resize < hashes < bktree < decode < c_api
# gray/resize/hashes are pure (no engine import); decode is the only layer that
# imports UniImage. The facade wires decode -> gray -> hashes.
[layers]
gray
resize
hashes
bktree
decode
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG.
[engines]
UniImage

# Packages confined to a single adapter: only the path named here may import
# the package or anything under it. UniImage decoding is deliberately behind
# decode.nim so the rest of the engine never sees a codec.
[confined]
UniImage = src/UniPercept/decode.nim
