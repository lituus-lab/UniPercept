[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UniPercept-lituus"
version = "1.0.1"
description = "Perceptual image hashing and Hamming-distance search backed by the native UniPercept engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
keywords = ["perceptual-hash", "image-similarity", "phash", "duplicate-detection", "bk-tree"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lituus-lab/UniPercept"
Repository = "https://github.com/lituus-lab/UniPercept"
Issues = "https://github.com/lituus-lab/UniPercept/issues"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
# Builds py/notebooks/quickstart.ipynb via py/notebooks/build_quickstart.py.
notebook = ["nbformat>=5", "nbclient>=0.10", "ipykernel"]

[tool.setuptools]
packages = ["unipercept"]
